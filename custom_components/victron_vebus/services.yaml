set_remote_panel_state:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: victron_vebus
    mode:
      required: true
      selector:
        select:
          translation_key: mode
          options:
            - "on"
            - "off"
            - charger_only
            - inverter_only
    current_limit:
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: A
          mode: box
    acknowledge_risk:
      required: true
      default: false
      selector:
        boolean:
