name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check that the manifest version matches the tag
        run: |
          version="$(jq -r .version custom_components/victron_vebus/manifest.json)"
          test "$version" = "${GITHUB_REF_NAME#v}" || {
            echo "manifest.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          }
      - name: Build zip
        run: cd custom_components/victron_vebus && zip -r ../../victron_vebus.zip . -x '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: victron_vebus.zip
