name: Release

# Pushing a tag such as v0.2.0 creates the GitHub release (with generated notes
# and the zip attached). Releases published by hand through the GitHub UI get
# the zip attached as well. Tags containing a "-" (v0.2.0-beta1) are marked as
# pre-releases.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check that the manifest version matches the tag
        run: |
          version="$(jq -r .version custom_components/victron_vebus/manifest.json)"
          test "$version" = "${GITHUB_REF_NAME#v}" || {
            echo "::error::manifest.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          }
      - name: Build zip
        run: cd custom_components/victron_vebus && zip -r ../../victron_vebus.zip . -x '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: victron_vebus.zip
