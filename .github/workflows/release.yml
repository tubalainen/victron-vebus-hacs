name: Release

# A release is created automatically when a new version reaches main: bump
# "version" in custom_components/victron_vebus/manifest.json and merge. The
# workflow then creates the vX.Y.Z tag and the GitHub release with generated
# notes and victron_vebus.zip attached. If docs/releases/vX.Y.Z.md exists, it
# is the release text and the generated notes are added below it. Versions
# containing a "-" (0.2.0-beta1) are published as pre-releases. Pushing a v* tag by hand, or publishing a
# release in the GitHub UI, still works and gets the zip attached.

on:
  push:
    branches:
      - main
    paths:
      - custom_components/victron_vebus/manifest.json
      - .github/workflows/release.yml
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version custom_components/victron_vebus/manifest.json)"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          notes="docs/releases/${tag}.md"
          if [[ -f "$notes" ]]; then echo "body_path=${notes}" >> "$GITHUB_OUTPUT"; fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Tag pushed or release published by hand: the tag must match.
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::manifest.json version $version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating release $tag from $GITHUB_SHA."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.version.outputs.publish == 'true'
        run: cd custom_components/victron_vebus && zip -r ../../victron_vebus.zip . -x '*/__pycache__/*'

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.version.outputs.body_path }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: victron_vebus.zip
